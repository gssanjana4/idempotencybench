[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "idempotencybench"
dynamic = ["version"]
description = "Benchmark for duplicate side effects of tool-using LLM agents under retries"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sanjana Gopnal Swamy" }]
keywords = ["llm", "agents", "benchmark", "idempotency", "retries", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
mcp = ["mcp>=1.9"]
plot = ["matplotlib>=3.5"]

[project.scripts]
idempotencybench = "idempotencybench.cli:main"

[project.urls]
Repository = "https://github.com/gssanjana4/idempotencybench"

[tool.setuptools.dynamic]
version = { attr = "idempotencybench.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
